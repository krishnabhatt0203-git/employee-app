<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Employee Details Portal</h1>
        </header>

        <!-- Notification Banner -->
        <div id="alert-box" class="alert hidden"></div>

        <!-- Employee Registration Form -->
        <section class="card">
            <h2>Add New Employee</h2>
            <form id="employee-form" novalidate>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="name">Full Name *</label>
                        <input type="text" id="name" required placeholder="John Doe">
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address *</label>
                        <input type="email" id="email" required placeholder="john@example.com">
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number *</label>
                        <input type="tel" id="phone" required placeholder="10-digit number">
                    </div>

                    <div class="form-group">
                        <label>Gender *</label>
                        <div class="radio-group">
                            <label><input type="radio" name="gender" value="Male" required> Male</label>
                            <label><input type="radio" name="gender" value="Female"> Female</label>
                            <label><input type="radio" name="gender" value="Other"> Other</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="department">Department *</label>
                        <select id="department" required>
                            <option value="">-- Select Department --</option>
                            <option value="HR">HR</option>
                            <option value="IT">IT</option>
                            <option value="Finance">Finance</option>
                            <option value="Sales">Sales</option>
                            <option value="Marketing">Marketing</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="designation">Designation *</label>
                        <input type="text" id="designation" required placeholder="Software Engineer">
                    </div>

                    <div class="form-group">
                        <label for="date_of_joining">Date of Joining *</label>
                        <input type="date" id="date_of_joining" required>
                    </div>

                    <div class="form-group">
                        <label for="salary">Salary (₹/$) *</label>
                        <input type="number" id="salary" min="1" step="0.01" required placeholder="50000">
                    </div>

                    <div class="form-group full-width">
                        <label for="address">Address</label>
                        <textarea id="address" rows="3" placeholder="Enter complete address"></textarea>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Submit Details</button>
            </form>
        </section>

        <!-- Employee Directory Table -->
        <section class="card">
            <h2>Employee Directory</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Department</th>
                            <th>Designation</th>
                            <th>Salary</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="employee-table-body">
                        <!-- Dynamic rows populated via JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
